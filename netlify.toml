[build]
  base    = "frontend"
  command = "npm install && npm run build"
  publish = "dist"
  # Si el push no toca frontend/, no se compila (cada build gasta créditos).
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  VITE_API_URL = "https://gestionjaardineria20-backend-production.up.railway.app"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
