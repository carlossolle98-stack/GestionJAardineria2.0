name: Chequeo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos
        # Cada error sale como anotación con archivo y línea, visible desde la API pública.
        run: |
          npx tsc --noEmit -p tsconfig.app.json --pretty false > tsc.log || true
          cat tsc.log
          n=0
          while IFS= read -r l; do
            if [[ "$l" =~ ^(.+)\(([0-9]+),([0-9]+)\):\ error\ (TS[0-9]+):\ (.*)$ ]]; then
              n=$((n+1))
              if   [ $n -le 10 ]; then t=error
              elif [ $n -le 20 ]; then t=warning
              else t=notice; fi
              echo "::$t file=frontend/${BASH_REMATCH[1]},line=${BASH_REMATCH[2]}::${BASH_REMATCH[4]} ${BASH_REMATCH[5]}"
            fi
          done < tsc.log
          echo "Errores de tipos: $n"
          [ $n -eq 0 ]
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: marianovatri/GestionJAardineria2.0-Backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Arranca en modo producción y responde las rutas
        env:
          NODE_ENV: production
          PORT: 4000
          MONGODB_URI: mongodb://127.0.0.1:27017/j2ci
          JWT_SECRET: ci-secreto-de-prueba-con-mas-de-32-caracteres
          CORS_ORIGIN: http://localhost
        run: |
          node src/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/health && break; sleep 1; done
          cat server.log
          ok=1
          for p in clientes inventario activos proveedores; do
            c=$(curl -s -o /dev/null -w '%{http_code}' localhost:4000/api/$p)
            echo "::notice::/api/$p -> $c"
            [ "$c" = "401" ] || ok=0
          done
          [ $ok -eq 1 ]
