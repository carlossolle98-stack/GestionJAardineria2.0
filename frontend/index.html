<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jardinería 2.0</title>
    <script>
      // Antes del primer pintado, para que no parpadee el tema equivocado.
      try {
        var t = localStorage.getItem('j2_tema') || 'claro';
        if (t !== 'auto') document.documentElement.dataset.tema = t;
      } catch (e) {
        document.documentElement.dataset.tema = 'claro';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
